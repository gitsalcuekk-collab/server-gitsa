<!DOCTYPE html>
<html lang="id" class="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aspirasi SMK Walisongo 2 Gempol</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script>
    tailwind.config = { darkMode: 'class' }
  </script>
</head>
<body class="bg-slate-100 dark:bg-slate-900 text-slate-800 dark:text-slate-100 min-h-screen font-sans pb-12 transition-colors duration-200">
  
  <!-- Navbar -->
  <nav class="bg-indigo-600 dark:bg-indigo-900 text-white shadow-lg sticky top-0 z-40">
    <div class="max-w-6xl mx-auto px-4 py-4 flex flex-wrap justify-between items-center gap-3">
      <div>
        <h1 class="font-extrabold text-lg md:text-xl">Aspirasi SMK Walisongo 2 Gempol</h1>
        <p class="text-xs text-indigo-200">Sistem Pengaduan & Aspirasi Siswa Digital</p>
      </div>
      <div class="flex items-center gap-2">
        <button id="themeToggle" class="p-2 rounded-xl bg-indigo-700 dark:bg-indigo-800 text-xs font-bold hover:bg-indigo-800">🌙 / ☀️</button>
        <button id="btnSiswa" class="px-3 py-2 rounded-xl bg-white text-indigo-600 font-bold text-xs md:text-sm shadow">Mode Siswa</button>
        <button id="btnAdmin" class="px-3 py-2 rounded-xl bg-indigo-700 text-indigo-100 font-bold text-xs md:text-sm hover:bg-indigo-800">Portal Guru / Admin</button>
      </div>
    </div>
  </nav>

  <div class="max-w-6xl mx-auto p-4 md:p-6">

    <!-- Stat Cards -->
    <div class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-6 text-center">
      <div class="bg-white dark:bg-slate-800 p-4 rounded-2xl shadow-sm border dark:border-slate-700">
        <p class="text-xs font-bold text-slate-400 uppercase">Total Aspirasi</p>
        <p id="statTotal" class="text-2xl font-black text-indigo-600 dark:text-indigo-400">0</p>
      </div>
      <div class="bg-white dark:bg-slate-800 p-4 rounded-2xl shadow-sm border dark:border-slate-700">
        <p class="text-xs font-bold text-slate-400 uppercase">Diproses</p>
        <p id="statProses" class="text-2xl font-black text-amber-500">0</p>
      </div>
      <div class="bg-white dark:bg-slate-800 p-4 rounded-2xl shadow-sm border dark:border-slate-700">
        <p class="text-xs font-bold text-slate-400 uppercase">Selesai</p>
        <p id="statSelesai" class="text-2xl font-black text-emerald-500">0</p>
      </div>
      <div class="bg-white dark:bg-slate-800 p-4 rounded-2xl shadow-sm border dark:border-slate-700">
        <p class="text-xs font-bold text-slate-400 uppercase">Ditolak</p>
        <p id="statDitolak" class="text-2xl font-black text-rose-500">0</p>
      </div>
    </div>

    <!-- SISWA VIEW -->
    <div id="viewSiswa" class="grid md:grid-cols-3 gap-6">
      <div class="bg-white dark:bg-slate-800 p-6 rounded-2xl shadow-sm border dark:border-slate-700 md:col-span-1 h-fit">
        <h2 class="text-base font-bold text-indigo-600 dark:text-indigo-400 mb-4">Kirim Aspirasi Anonim</h2>
        <form id="formPengaduan" class="space-y-4">
          <div>
            <label class="block text-xs font-bold uppercase text-slate-500 mb-1">Kategori</label>
            <select id="kategori" class="w-full border dark:border-slate-600 p-2.5 rounded-xl text-sm bg-slate-50 dark:bg-slate-700 dark:text-white">
              <option value="Fasilitas Sekolah">Fasilitas Sekolah</option>
              <option value="Keamanan & Bullying">Keamanan & Bullying</option>
              <option value="Akademik & Guru">Akademik & Guru</option>
              <option value="Saran & Masukan">Saran & Masukan</option>
            </select>
          </div>
          <div>
            <label class="block text-xs font-bold uppercase text-slate-500 mb-1">Tingkat Urgensi</label>
            <select id="urgensi" class="w-full border dark:border-slate-600 p-2.5 rounded-xl text-sm bg-slate-50 dark:bg-slate-700 dark:text-white">
              <option value="Biasa">Biasa</option>
              <option value="Penting">Penting</option>
              <option value="Sangat Mendesak">Sangat Mendesak</option>
            </select>
          </div>
          <div>
            <label class="block text-xs font-bold uppercase text-slate-500 mb-1">Isi Laporan / Keluhan</label>
            <textarea id="pesan" class="w-full border dark:border-slate-600 p-2.5 rounded-xl text-sm bg-slate-50 dark:bg-slate-700 dark:text-white" rows="3" required placeholder="Tuliskan keluhan atau saranmu..."></textarea>
          </div>
          
          <div>
            <label class="block text-xs font-bold uppercase text-slate-500 mb-1">Upload Bukti Foto (HP/Kamera)</label>
            <label for="fotoInput" class="flex items-center justify-center gap-2 w-full p-3 border-2 border-dashed border-indigo-300 dark:border-indigo-600 rounded-xl bg-indigo-50/50 dark:bg-slate-700 text-indigo-600 dark:text-indigo-300 text-xs font-bold cursor-pointer hover:bg-indigo-100 transition">
              <span class="text-lg font-black">+</span> <span id="fileName">Pilih Foto Dari HP</span>
            </label>
            <input type="file" id="fotoInput" accept="image/*" class="hidden" onchange="handleFile(this)">
            <div id="previewContainer" class="mt-2 hidden">
              <img id="imgPreview" class="max-h-32 rounded-lg border">
            </div>
          </div>

          <button type="submit" class="w-full bg-indigo-600 text-white font-bold py-3 rounded-xl text-sm shadow hover:bg-indigo-700">
            Kirim Laporan
          </button>
        </form>
      </div>

      <div class="md:col-span-2 space-y-4">
        <!-- Search & Filter Bar -->
        <div class="bg-white dark:bg-slate-800 p-4 rounded-2xl border dark:border-slate-700 flex flex-col sm:flex-row gap-3 justify-between">
          <input type="text" id="searchInput" oninput="loadData()" placeholder="🔍 Cari kata kunci atau #TIKET..." class="border dark:border-slate-600 p-2 rounded-xl text-xs flex-1 bg-slate-50 dark:bg-slate-700 dark:text-white outline-none">
          <select id="filterStatus" onchange="loadData()" class="border dark:border-slate-600 p-2 rounded-xl text-xs bg-slate-50 dark:bg-slate-700 dark:text-white font-bold">
            <option value="ALL">Semua Status</option>
            <option value="Diproses">Diproses</option>
            <option value="Selesai">Selesai</option>
            <option value="Ditolak">Ditolak</option>
          </select>
        </div>

        <div id="daftarLaporanPublic" class="space-y-4"></div>
      </div>
    </div>

    <!-- ADMIN VIEW -->
    <div id="viewAdmin" class="hidden space-y-6">
      <!-- Chart Dashboard -->
      <div class="bg-white dark:bg-slate-800 p-6 rounded-2xl shadow-sm border dark:border-slate-700">
        <h3 class="text-sm font-bold text-slate-700 dark:text-slate-200 mb-3">📊 Grafik Statistik Kategori Laporan</h3>
        <div class="max-w-md mx-auto">
          <canvas id="categoryChart"></canvas>
        </div>
      </div>

      <div class="bg-white dark:bg-slate-800 p-6 rounded-2xl shadow-sm border dark:border-slate-700">
        <div class="flex flex-col sm:flex-row justify-between sm:items-center gap-3 mb-6 pb-4 border-b dark:border-slate-700">
          <div>
            <h2 class="text-lg font-bold text-slate-800 dark:text-white">Panel Kelola Pengaduan (Guru/Admin)</h2>
            <p class="text-xs text-slate-500">Kelola status laporan, beri alasan/balasan, atau cetak rekap PDF.</p>
          </div>
          <div class="flex gap-2">
            <button onclick="window.print()" class="bg-indigo-600 text-white px-3 py-1.5 rounded-xl text-xs font-bold hover:bg-indigo-700">🖨️ Cetak Laporan (PDF)</button>
            <button id="btnLogout" class="bg-rose-50 text-rose-600 px-3 py-1.5 rounded-xl text-xs font-bold hover:bg-rose-100">Keluar Admin</button>
          </div>
        </div>
        <div id="daftarLaporanAdmin" class="space-y-4"></div>
      </div>
    </div>

  </div>

  <script>
    let currentMode = 'siswa';
    let uploadedBase64 = '';
    let chartInstance = null;

    const themeToggle = document.getElementById('themeToggle');
    themeToggle.onclick = () => document.documentElement.classList.toggle('dark');

    function handleFile(input) {
      const file = input.files[0];
      if (file) {
        document.getElementById('fileName').innerText = file.name;
        const img = new Image();
        const reader = new FileReader();
        reader.onload = function(e) {
          img.src = e.target.result;
          img.onload = function() {
            const canvas = document.createElement('canvas');
            const ctx = canvas.getContext('2d');
            const maxW = 350;
            const scale = maxW / img.width;
            canvas.width = maxW;
            canvas.height = img.height * scale;
            ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
            uploadedBase64 = canvas.toDataURL('image/jpeg', 0.5);
            
            document.getElementById('imgPreview').src = uploadedBase64;
            document.getElementById('previewContainer').classList.remove('hidden');
          };
        };
        reader.readAsDataURL(file);
      }
    }

    const btnSiswa = document.getElementById('btnSiswa');
    const btnAdmin = document.getElementById('btnAdmin');
    const btnLogout = document.getElementById('btnLogout');
    const viewSiswa = document.getElementById('viewSiswa');
    const viewAdmin = document.getElementById('viewAdmin');

    btnSiswa.onclick = () => showTab('siswa');
    
    btnAdmin.onclick = () => {
      if (currentMode === 'admin') return;
      const pass = prompt('Masukkan Password Admin Guru:');
      if (pass === 'guru969') {
        showTab('admin');
        alert('Berhasil masuk mode Admin!');
      } else if (pass !== null) {
        alert('Password salah!');
      }
    };

    btnLogout.onclick = () => {
      showTab('siswa');
      alert('Anda kembali ke Mode Siswa.');
    };

    function showTab(mode) {
      currentMode = mode;
      if (mode === 'siswa') {
        viewSiswa.classList.remove('hidden');
        viewAdmin.classList.add('hidden');
      } else {
        viewSiswa.classList.add('hidden');
        viewAdmin.classList.remove('hidden');
      }
      loadData();
    }

    function renderChart(data) {
      const categories = ['Fasilitas Sekolah', 'Keamanan & Bullying', 'Akademik & Guru', 'Saran & Masukan'];
      const counts = categories.map(cat => data.filter(item => item.kategori === cat).length);

      const ctx = document.getElementById('categoryChart').getContext('2d');
      if (chartInstance) chartInstance.destroy();

      chartInstance = new Chart(ctx, {
        type: 'doughnut',
        data: {
          labels: categories,
          datasets: [{
            data: counts,
            backgroundColor: ['#6366f1', '#f59e0b', '#10b981', '#ef4444']
          }]
        },
        options: {
          responsive: true,
          plugins: { legend: { position: 'bottom' } }
        }
      });
    }

    async function loadData() {
      const res = await fetch('/api/laporan');
      const data = await res.json();

      document.getElementById('statTotal').innerText = data.length;
      document.getElementById('statProses').innerText = data.filter(i => i.status === 'Diproses').length;
      document.getElementById('statSelesai').innerText = data.filter(i => i.status === 'Selesai').length;
      document.getElementById('statDitolak').innerText = data.filter(i => i.status === 'Ditolak').length;

      if (currentMode === 'admin') renderChart(data);

      const search = document.getElementById('searchInput').value.toLowerCase();
      const statusFilter = document.getElementById('filterStatus').value;

      let filtered = data.filter(item => {
        const matchSearch = item.pesan.toLowerCase().includes(search) || item.kategori.toLowerCase().includes(search) || (item.ticket && item.ticket.toLowerCase().includes(search));
        const matchStatus = statusFilter === 'ALL' || item.status === statusFilter;
        return matchSearch && matchStatus;
      });

      const publicContainer = document.getElementById('daftarLaporanPublic');
      publicContainer.innerHTML = '';
      filtered.forEach(item => {
        let badge = '<span class="bg-amber-100 text-amber-700 text-xs font-bold px-3 py-1 rounded-full">Diproses</span>';
        if (item.status === 'Selesai') badge = '<span class="bg-emerald-100 text-emerald-700 text-xs font-bold px-3 py-1 rounded-full">Selesai</span>';
        if (item.status === 'Ditolak') badge = '<span class="bg-rose-100 text-rose-700 text-xs font-bold px-3 py-1 rounded-full">Ditolak</span>';

        const tanggapan = item.tanggapan ? 
          '<div class="mt-3 p-3 bg-slate-50 dark:bg-slate-700 border-l-4 ' + (item.status === 'Ditolak' ? 'border-rose-500' : 'border-indigo-500') + ' text-xs text-slate-600 dark:text-slate-200"><b>' + (item.status === 'Ditolak' ? 'Alasan Penolakan:' : 'Tanggapan Sekolah:') + '</b> ' + item.tanggapan + '</div>' : '';

        const fotoHtml = item.foto ? '<div class="mt-3"><img src="' + item.foto + '" class="max-h-52 rounded-xl border shadow-sm object-cover"></div>' : '';

        publicContainer.innerHTML += 
          '<div class="bg-white dark:bg-slate-800 p-5 rounded-2xl border dark:border-slate-700 shadow-sm">' +
            '<div class="flex justify-between items-center mb-2">' +
              '<div class="flex items-center gap-2">' +
                '<span class="text-xs font-bold text-indigo-600 dark:text-indigo-400 bg-indigo-50 dark:bg-slate-700 px-2.5 py-1 rounded-lg">' + item.kategori + '</span>' +
                '<span class="text-[11px] font-mono font-bold text-slate-400">' + (item.ticket || '') + '</span>' +
              '</div>' +
              badge +
            '</div>' +
            '<p class="text-slate-800 dark:text-slate-100 text-sm my-2">' + item.pesan + '</p>' +
            fotoHtml +
            tanggapan +
            '<div class="flex justify-between items-center mt-3 pt-2 border-t dark:border-slate-700 text-xs">' +
              '<button onclick="upvote(' + item.id + ')" class="bg-slate-100 dark:bg-slate-700 text-slate-700 dark:text-slate-200 px-3 py-1 rounded-lg font-bold hover:bg-indigo-50">👍 Dukung (' + (item.upvotes || 0) + ')</button>' +
              '<span class="text-[11px] text-slate-400">' + item.tanggal + '</span>' +
            '</div>' +
          '</div>';
      });

      const adminContainer = document.getElementById('daftarLaporanAdmin');
      adminContainer.innerHTML = '';
      data.forEach(item => {
        const fotoHtmlAdmin = item.foto ? '<div class="mt-2"><img src="' + item.foto + '" class="max-h-36 rounded-lg border"></div>' : '';

        adminContainer.innerHTML += 
          '<div class="p-4 border dark:border-slate-700 rounded-xl bg-slate-50 dark:bg-slate-700 space-y-3">' +
            '<div class="flex justify-between text-xs font-bold">' +
              '<span class="text-indigo-600 dark:text-indigo-300">' + item.kategori + ' (' + item.ticket + ') - 👍 ' + (item.upvotes || 0) + ' Dukungan</span>' +
              '<span class="text-slate-400 font-normal">' + item.tanggal + '</span>' +
            '</div>' +
            '<p class="text-sm font-medium text-slate-800 dark:text-slate-100">' + item.pesan + '</p>' +
            fotoHtmlAdmin +
            '<div class="flex flex-col md:flex-row gap-2">' +
              '<input type="text" id="reply-' + item.id + '" placeholder="Tulis balasan / alasan penolakan..." value="' + (item.tanggapan || '') + '" class="flex-1 border p-2 rounded text-xs dark:bg-slate-800 dark:text-white">' +
              '<button onclick="updateStatus(' + item.id + ', \'Selesai\')" class="bg-emerald-600 text-white px-3 py-1.5 rounded text-xs font-bold">Set Selesai</button>' +
              '<button onclick="updateStatus(' + item.id + ', \'Ditolak\')" class="bg-rose-600 text-white px-3 py-1.5 rounded text-xs font-bold">Tolak</button>' +
              '<button onclick="deleteLaporan(' + item.id + ')" class="bg-red-700 text-white px-3 py-1.5 rounded text-xs font-bold">🗑️ Hapus</button>' +
            '</div>' +
          '</div>';
      });
    }

    document.getElementById('formPengaduan').onsubmit = async (e) => {
      e.preventDefault();
      const kategori = document.getElementById('kategori').value;
      const urgensi = document.getElementById('urgensi').value;
      const pesan = document.getElementById('pesan').value;

      const res = await fetch('/api/laporan', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ kategori, urgensi, pesan, foto: uploadedBase64 })
      });

      if (!res.ok) {
        alert('Terlalu banyak mengirim laporan! Harap tunggu sebentar.');
        return;
      }

      document.getElementById('pesan').value = '';
      document.getElementById('fotoInput').value = '';
      document.getElementById('fileName').innerText = 'Pilih Foto Dari HP';
      document.getElementById('previewContainer').classList.add('hidden');
      uploadedBase64 = '';
      alert('Laporan berhasil dikirim!');
      loadData();
    };

    async function upvote(id) {
      await fetch('/api/laporan/upvote', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ id })
      });
      loadData();
    }

    async function updateStatus(id, status) {
      const tanggapan = document.getElementById('reply-' + id).value;
      await fetch('/api/laporan/update', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ id, status, tanggapan })
      });
      alert('Status laporan diperbarui!');
      loadData();
    }

    async function deleteLaporan(id) {
      if (confirm('Yakin ingin menghapus aduan ini?')) {
        await fetch('/api/laporan/delete', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ id })
        });
        alert('Aduan berhasil dihapus!');
        loadData();
      }
    }

    loadData();
  </script>
</body>
</html>
