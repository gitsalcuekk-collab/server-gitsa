<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aspirasi SMK Walisongo 2 Gempol</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 min-h-screen text-slate-800 font-sans pb-12">
  
  <!-- Navbar -->
  <nav class="bg-indigo-600 text-white shadow-lg sticky top-0 z-40">
    <div class="max-w-6xl mx-auto px-4 py-4 flex justify-between items-center">
      <div>
        <h1 class="font-extrabold text-lg md:text-xl">Aspirasi SMK Walisongo 2 Gempol</h1>
        <p class="text-xs text-indigo-200">Layanan Pengaduan & Aspirasi Siswa</p>
      </div>
      <div class="flex items-center gap-2">
        <button id="btnSiswa" class="px-4 py-2 rounded-xl bg-white text-indigo-600 font-bold text-sm shadow">
          Mode Siswa
        </button>
        <button id="btnAdmin" class="px-4 py-2 rounded-xl bg-indigo-700 text-indigo-100 font-bold text-sm hover:bg-indigo-800">
          Portal Guru / Admin
        </button>
      </div>
    </div>
  </nav>

  <div class="max-w-6xl mx-auto p-4 md:p-6">

    <!-- Stat Cards -->
    <div class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-8 text-center">
      <div class="bg-white p-4 rounded-2xl shadow-sm border">
        <p class="text-xs font-bold text-slate-400 uppercase">Total Aspirasi</p>
        <p id="statTotal" class="text-2xl font-black text-indigo-600">0</p>
      </div>
      <div class="bg-white p-4 rounded-2xl shadow-sm border">
        <p class="text-xs font-bold text-slate-400 uppercase">Diproses</p>
        <p id="statProses" class="text-2xl font-black text-amber-500">0</p>
      </div>
      <div class="bg-white p-4 rounded-2xl shadow-sm border">
        <p class="text-xs font-bold text-slate-400 uppercase">Selesai</p>
        <p id="statSelesai" class="text-2xl font-black text-emerald-500">0</p>
      </div>
      <div class="bg-white p-4 rounded-2xl shadow-sm border">
        <p class="text-xs font-bold text-slate-400 uppercase">Ditolak</p>
        <p id="statDitolak" class="text-2xl font-black text-rose-500">0</p>
      </div>
    </div>

    <!-- SISWA VIEW -->
    <div id="viewSiswa" class="grid md:grid-cols-3 gap-6">
      <div class="bg-white p-6 rounded-2xl shadow-sm border md:col-span-1 h-fit">
        <h2 class="text-base font-bold text-indigo-600 mb-4">Kirim Aspirasi Anonim</h2>
        <form id="formPengaduan" class="space-y-4">
          <div>
            <label class="block text-xs font-bold uppercase text-slate-600 mb-1">Kategori</label>
            <select id="kategori" class="w-full border p-2.5 rounded-xl text-sm bg-slate-50">
              <option value="Fasilitas Sekolah">Fasilitas Sekolah</option>
              <option value="Keamanan & Bullying">Keamanan & Bullying</option>
              <option value="Akademik & Guru">Akademik & Guru</option>
              <option value="Saran & Masukan">Saran & Masukan</option>
            </select>
          </div>
          <div>
            <label class="block text-xs font-bold uppercase text-slate-600 mb-1">Tingkat Urgensi</label>
            <select id="urgensi" class="w-full border p-2.5 rounded-xl text-sm bg-slate-50">
              <option value="Biasa">Biasa</option>
              <option value="Penting">Penting</option>
              <option value="Sangat Mendesak">Sangat Mendesak</option>
            </select>
          </div>
          <div>
            <label class="block text-xs font-bold uppercase text-slate-600 mb-1">Isi Laporan / Keluhan</label>
            <textarea id="pesan" class="w-full border p-2.5 rounded-xl text-sm bg-slate-50" rows="3" required placeholder="Tuliskan keluhan atau saranmu..."></textarea>
          </div>
          
          <!-- Tombol Upload File HP / Android -->
          <div>
            <label class="block text-xs font-bold uppercase text-slate-600 mb-1">Lampiran Foto Bukti (Opsional)</label>
            <label for="fotoInput" class="flex items-center justify-center gap-2 w-full p-3 border-2 border-dashed border-indigo-300 rounded-xl bg-indigo-50/50 text-indigo-600 text-xs font-bold cursor-pointer hover:bg-indigo-100 transition">
              <span class="text-lg font-black">+</span> <span id="fileName">Ambil Kamera / Galeri HP</span>
            </label>
            <input type="file" id="fotoInput" accept="image/*" class="hidden" onchange="handleFile(this)">
          </div>

          <button type="submit" class="w-full bg-indigo-600 text-white font-bold py-3 rounded-xl text-sm shadow hover:bg-indigo-700">
            Kirim Laporan
          </button>
        </form>
      </div>

      <div class="md:col-span-2">
        <h2 class="text-base font-bold text-slate-700 mb-4">Daftar Aspirasi Terbaru</h2>
        <div id="daftarLaporanPublic" class="space-y-4"></div>
      </div>
    </div>

    <!-- ADMIN VIEW -->
    <div id="viewAdmin" class="hidden">
      <div class="bg-white p-6 rounded-2xl shadow-sm border">
        <div class="flex justify-between items-center mb-6 pb-4 border-b">
          <div>
            <h2 class="text-lg font-bold text-slate-800">Panel Kelola Pengaduan (Guru/Admin)</h2>
            <p class="text-xs text-slate-500">Hapus laporan spam, kelola status aduan, atau beri balasan.</p>
          </div>
          <button id="btnLogout" class="bg-rose-50 text-rose-600 px-3 py-1.5 rounded-xl text-xs font-bold hover:bg-rose-100">Keluar Admin</button>
        </div>
        <div id="daftarLaporanAdmin" class="space-y-4"></div>
      </div>
    </div>

  </div>

  <script>
    let currentMode = 'siswa';
    let uploadedBase64 = '';

    const btnSiswa = document.getElementById('btnSiswa');
    const btnAdmin = document.getElementById('btnAdmin');
    const btnLogout = document.getElementById('btnLogout');
    const viewSiswa = document.getElementById('viewSiswa');
    const viewAdmin = document.getElementById('viewAdmin');

    function handleFile(input) {
      const file = input.files[0];
      if (file) {
        document.getElementById('fileName').innerText = file.name;
        const reader = new FileReader();
        reader.onload = function(e) {
          uploadedBase64 = e.target.result;
        };
        reader.readAsDataURL(file);
      }
    }

    btnSiswa.onclick = () => showTab('siswa');
    
    btnAdmin.onclick = () => {
      if (currentMode === 'admin') return;
      const pass = prompt('Masukkan Password Admin Guru:');
      if (pass === 'guru969') {
        showTab('admin');
        alert('Berhasil masuk mode Admin!');
      } else if (pass !== null) {
        alert('Password salah!');
      }
    };

    btnLogout.onclick = () => {
      showTab('siswa');
      alert('Anda kembali ke Mode Siswa.');
    };

    function showTab(mode) {
      currentMode = mode;
      if (mode === 'siswa') {
        viewSiswa.classList.remove('hidden');
        viewAdmin.classList.add('hidden');
        btnSiswa.className = "px-4 py-2 rounded-xl bg-white text-indigo-600 font-bold text-sm shadow";
        btnAdmin.className = "px-4 py-2 rounded-xl bg-indigo-700 text-indigo-100 font-bold text-sm hover:bg-indigo-800";
      } else {
        viewSiswa.classList.add('hidden');
        viewAdmin.classList.remove('hidden');
        btnAdmin.className = "px-4 py-2 rounded-xl bg-white text-indigo-600 font-bold text-sm shadow";
        btnSiswa.className = "px-4 py-2 rounded-xl bg-indigo-700 text-indigo-100 font-bold text-sm hover:bg-indigo-800";
      }
      loadData();
    }

    async function loadData() {
      const res = await fetch('/api/laporan');
      const data = await res.json();

      document.getElementById('statTotal').innerText = data.length;
      document.getElementById('statProses').innerText = data.filter(i => i.status === 'Diproses').length;
      document.getElementById('statSelesai').innerText = data.filter(i => i.status === 'Selesai').length;
      document.getElementById('statDitolak').innerText = data.filter(i => i.status === 'Ditolak').length;

      const publicContainer = document.getElementById('daftarLaporanPublic');
      publicContainer.innerHTML = '';
      data.forEach(item => {
        let badge = '<span class="bg-amber-100 text-amber-700 text-xs font-bold px-3 py-1 rounded-full">Diproses</span>';
        if (item.status === 'Selesai') badge = '<span class="bg-emerald-100 text-emerald-700 text-xs font-bold px-3 py-1 rounded-full">Selesai</span>';
        if (item.status === 'Ditolak') badge = '<span class="bg-rose-100 text-rose-700 text-xs font-bold px-3 py-1 rounded-full">Ditolak</span>';

        let urgensiBadge = '<span class="text-[10px] bg-slate-100 text-slate-600 px-2 py-0.5 rounded font-semibold">' + (item.urgensi || 'Biasa') + '</span>';
        if (item.urgensi === 'Sangat Mendesak') urgensiBadge = '<span class="text-[10px] bg-rose-100 text-rose-600 px-2 py-0.5 rounded font-bold">Sangat Mendesak</span>';

        const tanggapan = item.tanggapan ? 
          '<div class="mt-3 p-3 bg-slate-50 border-l-4 ' + (item.status === 'Ditolak' ? 'border-rose-500' : 'border-indigo-500') + ' text-xs text-slate
