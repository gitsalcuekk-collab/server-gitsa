<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aspirasi Siswa - SMK Walisongo 2 Gempol</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen text-gray-800">

  <!-- Header -->
  <header class="bg-blue-900 text-white p-5 shadow-lg">
    <div class="max-w-4xl mx-auto flex justify-between items-center">
      <div>
        <h1 class="text-2xl font-bold">SMK WALISONGO 2 GEMPOL</h1>
        <p class="text-sm text-blue-200">Kotak Aspirasi & Suara Siswa Online</p>
      </div>
    </div>
  </header>

  <div class="max-w-4xl mx-auto p-4 grid grid-cols-1 md:grid-cols-3 gap-6 mt-4">
    
    <!-- Form Kirim Aspirasi -->
    <div class="bg-white p-5 rounded-lg shadow-md h-fit">
      <h2 class="text-lg font-bold border-b pb-2 mb-4 text-blue-900">Kirim Aspirasi</h2>
      <form id="formAspirasi" enctype="multipart/form-data" class="space-y-3">
        <div>
          <label class="inline-flex items-center text-sm font-semibold">
            <input type="checkbox" id="anonim" class="rounded text-blue-600" onchange="toggleAnonim()">
            <span class="ml-2">Kirim secara Anonim</span>
          </label>
        </div>
        <div id="identitasGroup">
          <input type="text" id="nama" placeholder="Nama Lengkap" class="w-full border p-2 rounded mb-2 text-sm">
          <input type="text" id="kelas" placeholder="Kelas (Contoh: X TKJ 1)" class="w-full border p-2 rounded text-sm">
        </div>
        <div>
          <select id="kategori" class="w-full border p-2 rounded text-sm">
            <option value="Lab & Fasilitas">Lab & Fasilitas</option>
            <option value="Kantin & Kebersihan">Kantin & Kebersihan</option>
            <option value="Kedisiplinan & Sarpras">Kedisiplinan & Sarpras</option>
            <option value="Saran Kegiatan">Saran Kegiatan / OSIS</option>
          </select>
        </div>
        <input type="text" id="judul" placeholder="Judul Aspirasi" required class="w-full border p-2 rounded text-sm">
        <textarea id="isi" rows="3" placeholder="Tuliskan aspirasi/keluhan kamu..." required class="w-full border p-2 rounded text-sm"></textarea>
        <div>
          <label class="text-xs text-gray-500">Upload Foto Bukti (Opsional):</label>
          <input type="file" id="foto" accept="image/*" class="w-full text-xs">
        </div>
        <button type="submit" class="w-full bg-blue-900 text-white py-2 rounded font-semibold hover:bg-blue-800 text-sm">Kirim Aspirasi</button>
      </form>
    </div>

    <!-- Feed Aspirasi -->
    <div class="md:col-span-2 space-y-4">
      <h2 class="text-lg font-bold text-gray-700">Daftar Aspirasi Siswa</h2>
      <div id="listAspirasi" class="space-y-3">
        <!-- Aspirasi akan dimuat di sini -->
      </div>
    </div>

  </div>

  <script>
    function toggleAnonim() {
      const isAnonim = document.getElementById('anonim').checked;
      document.getElementById('identitasGroup').classList.toggle('hidden', isAnonim);
    }

    async function loadAspirasi() {
      const res = await fetch('/api/aspirasi');
      const data = await res.json();
      const container = document.getElementById('listAspirasi');
      container.innerHTML = '';

      data.forEach(item => {
        let statusColor = item.status === 'Selesai' ? 'bg-green-100 text-green-800' : 
                         (item.status === 'Diproses' ? 'bg-yellow-100 text-yellow-800' : 'bg-gray-100 text-gray-800');

        container.innerHTML += `
          <div class="bg-white p-4 rounded-lg shadow-md border-l-4 border-blue-900">
            <div class="flex justify-between items-start">
              <div>
                <span class="text-xs font-bold text-blue-900 uppercase">${item.kategori}</span>
                <h3 class="font-bold text-md">${item.judul}</h3>
                <p class="text-xs text-gray-500">Oleh: ${item.nama} (${item.kelas}) • ${item.tanggal}</p>
              </div>
              <span class="text-xs px-2 py-1 rounded font-semibold ${statusColor}">${item.status}</span>
            </div>
            <p class="text-sm mt-2 text-gray-700">${item.isi}</p>
            ${item.foto ? `<img src="${item.foto}" class="mt-2 max-h-48 rounded shadow-sm">` : ''}
            
            ${item.tanggapan ? `
              <div class="mt-3 p-2 bg-blue-50 border-l-2 border-blue-600 rounded text-xs">
                <span class="font-bold text-blue-900">Tanggapan Sekolah:</span>
                <p class="text-gray-700">${item.tanggapan}</p>
              </div>
            ` : ''}

            <div class="mt-3 flex justify-between items-center border-t pt-2">
              <button onclick="upvote(${item.id})" class="text-xs bg-gray-100 hover:bg-gray-200 px-3 py-1 rounded flex items-center gap-1 font-semibold">
                👍 Dukung (${item.upvotes})
              </button>
            </div>
          </div>
        `;
      });
    }

    document.getElementById('formAspirasi').onsubmit = async (e) => {
      e.preventDefault();
      const formData = new FormData();
      formData.append('anonim', document.getElementById('anonim').checked);
      formData.append('nama', document.getElementById('nama').value);
      formData.append('kelas', document.getElementById('kelas').value);
      formData.append('kategori', document.getElementById('kategori').value);
      formData.append('judul', document.getElementById('judul').value);
      formData.append('isi', document.getElementById('isi').value);
      if (document.getElementById('foto').files[0]) {
        formData.append('foto', document.getElementById('foto').files[0]);
      }

      await fetch('/api/aspirasi', { method: 'POST', body: formData });
      document.getElementById('formAspirasi').reset();
      toggleAnonim();
      loadAspirasi();
    };

    async function upvote(id) {
      await fetch(`/api/aspirasi/${id}/upvote`, { method: 'POST' });
      loadAspirasi();
    }

    loadAspirasi();
  </script>
</body>
</html>
